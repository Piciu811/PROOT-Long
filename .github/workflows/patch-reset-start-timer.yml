name: Patch reset start timer

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-reset-start-timer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start timer on physical button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()
          old = 'measurementActive=true;timingStopped=false;lapClockRunning=false;lapStartTow=tow;lapDeltaValid=false;lapFlashStarted=0;curTraceN=0;refCursor=0;lastTraceTow=0;lastCrossTow=0;rbRequestRecording(true);'
          new = 'measurementActive=true;timingStopped=false;lapClockRunning=true;lapStartTow=tow;lapDeltaValid=false;lapFlashStarted=0;curTraceN=0;refCursor=0;lastTraceTow=0;lastCrossTow=0;customLineArmed=false;rbRequestRecording(true);'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'Start lap timer on physical reset button'
          git push
