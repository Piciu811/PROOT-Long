name: Patch physical RESET start like S/M

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-reset-start-like-sm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch physical RESET start
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.cpp')
          s=p.read_text()
          old='''}else if(!measurementLocked){uint8_t fix,sats;uint32_t tow;portENTER_CRITICAL(&rbDataMux);fix=rbFix;sats=rbSats;tow=rbTowMs;portEXIT_CRITICAL(&rbDataMux);if(fix>=2&&sats>0){measurementActive=true;timingStopped=false;sessionLeanMin=0.0f;sessionLeanMax=0.0f;lapClockRunning=true;lapStartTow=tow;lapDeltaValid=false;lapFlashStarted=0;curTraceN=0;refCursor=0;lastTraceTow=0;lastCrossTow=0;customLineArmed=false;rbRequestRecording(true);}}'''
          new='''}else if(!measurementLocked){saveCustomLine();}'''
          if old not in s:
              raise SystemExit('physical RESET start target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'Make physical RESET start like S/M'
          git push
