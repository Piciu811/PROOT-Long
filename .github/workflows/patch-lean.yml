name: Patch LEAN pitch handling

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-lean.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch LEAN accelerometer formula
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()
          old = '''      const uint8_t *p=fifo+6; uint32_t speedMm=0,tow=0;int32_t lonRaw=0,latRaw=0;int16_t gY=0,gZ=0,gyroX=0;
                memcpy(&tow,p+0,4);memcpy(&lonRaw,p+24,4);memcpy(&latRaw,p+28,4);memcpy(&speedMm,p+48,4);memcpy(&gY,p+70,2);memcpy(&gZ,p+72,2);memcpy(&gyroX,p+74,2);
                float speedKmh=(float)speedMm*0.0036f;
                float accelRoll=atan2f((float)gY,(float)gZ)*57.2957795f;
          '''
          new = '''      const uint8_t *p=fifo+6; uint32_t speedMm=0,tow=0;int32_t lonRaw=0,latRaw=0;int16_t gX=0,gY=0,gZ=0,gyroX=0;
                memcpy(&tow,p+0,4);memcpy(&lonRaw,p+24,4);memcpy(&latRaw,p+28,4);memcpy(&speedMm,p+48,4);memcpy(&gX,p+68,2);memcpy(&gY,p+70,2);memcpy(&gZ,p+72,2);memcpy(&gyroX,p+74,2);
                float speedKmh=(float)speedMm*0.0036f;
                float gx=(float)gX,gy=(float)gY,gz=(float)gZ;
                float accelRoll=atan2f(gy,sqrtf(gx*gx+gz*gz))*57.2957795f;
          '''
          if old not in s:
              raise SystemExit('Expected LEAN block not found; refusing to patch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'Fix LEAN when pitched forward or backward'
          git push
