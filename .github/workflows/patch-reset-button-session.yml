name: Patch reset-button measurement session

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-reset-button-session.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch measurement start stop control
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()

          old = 'static bool timingStopped=false;\n'
          new = 'static bool timingStopped=false;\nstatic bool measurementActive=false;\nstatic bool measurementLocked=false;\n'
          if old not in s:
              raise SystemExit('state insertion point not found')
          s = s.replace(old, new, 1)

          old = 'if(customLineValid&&!customDirectionPending&&havePrevFix&&!timingStopped){'
          new = 'if(customLineValid&&!customDirectionPending&&havePrevFix&&measurementActive&&!timingStopped){'
          if old not in s:
              raise SystemExit('lap gate not found')
          s = s.replace(old, new, 1)

          old = 'static uint32_t resetPressStarted=0;static bool resetHoldDone=false;bool resetDown=(digitalRead(PIN_BUTTON_1)==LOW);if(resetDown&&!resetPressStarted&&!resetHoldDone)resetPressStarted=millis();if(resetDown&&resetPressStarted&&!resetHoldDone&&millis()-resetPressStarted>=3000u){touchLocked=!touchLocked;resetHoldDone=true;resetPressStarted=0;if(connState==CONN_OK&&rbConnected&&screen){while(lcd_PushColors_len>0){lcd_PushColors(0,0,0,0,NULL);delay(1);}drawRaceBoxLive();}}if(!resetDown){resetPressStarted=0;resetHoldDone=false;}'
          new = '''static uint32_t resetPressStarted=0;static bool resetHoldDone=false;bool resetDown=(digitalRead(PIN_BUTTON_1)==LOW);if(resetDown&&!resetPressStarted&&!resetHoldDone)resetPressStarted=millis();if(resetDown&&resetPressStarted&&!resetHoldDone&&millis()-resetPressStarted>=3000u){touchLocked=!touchLocked;resetHoldDone=true;resetPressStarted=0;if(connState==CONN_OK&&rbConnected&&screen){while(lcd_PushColors_len>0){lcd_PushColors(0,0,0,0,NULL);delay(1);}drawRaceBoxLive();}}if(!resetDown&&resetPressStarted&&!resetHoldDone){uint32_t held=millis()-resetPressStarted;if(held>=50u&&held<3000u&&connState==CONN_OK&&rbConnected){if(measurementActive){rbRequestRecording(false);measurementActive=false;measurementLocked=true;timingStopped=true;lapClockRunning=false;lapDeltaValid=false;lapFlashStarted=0;}else if(!measurementLocked){uint8_t fix,sats;uint32_t tow;portENTER_CRITICAL(&rbDataMux);fix=rbFix;sats=rbSats;tow=rbTowMs;portEXIT_CRITICAL(&rbDataMux);if(fix>=2&&sats>0){measurementActive=true;timingStopped=false;lapClockRunning=false;lapStartTow=tow;lapDeltaValid=false;lapFlashStarted=0;curTraceN=0;refCursor=0;lastTraceTow=0;lastCrossTow=0;rbRequestRecording(true);}}if(screen){while(lcd_PushColors_len>0){lcd_PushColors(0,0,0,0,NULL);delay(1);}drawRaceBoxLive();}}resetPressStarted=0;resetHoldDone=false;}else if(!resetDown){resetPressStarted=0;resetHoldDone=false;}'''
          if old not in s:
              raise SystemExit('physical reset-button block not found')
          s = s.replace(old, new, 1)

          old = 'millis()-stopPressStarted>=1500u'
          new = 'millis()-stopPressStarted>=3000u'
          if old not in s:
              raise SystemExit('STOP long-hold threshold not found')
          s = s.replace(old, new, 1)

          old = 'millis()-stopPressStarted<1500u'
          new = 'millis()-stopPressStarted<3000u'
          if old not in s:
              raise SystemExit('STOP short-hold threshold not found')
          s = s.replace(old, new, 1)

          old = 'rbRequestRecording(false);lapClockRunning=false;timingStopped=false;lapCount=0;'
          new = 'rbRequestRecording(false);measurementActive=false;measurementLocked=false;lapClockRunning=false;timingStopped=false;lapCount=0;'
          if old not in s:
              raise SystemExit('STOP reset block not found')
          s = s.replace(old, new, 1)

          old = 'rbRequestRecording(false);timingStopped=true;lapClockRunning=false;lapDeltaValid=false;lapFlashStarted=0;'
          new = 'rbRequestRecording(false);measurementActive=false;measurementLocked=true;timingStopped=true;lapClockRunning=false;lapDeltaValid=false;lapFlashStarted=0;'
          if old not in s:
              raise SystemExit('STOP short-click block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'Control measurement session with physical reset button'
          git push
