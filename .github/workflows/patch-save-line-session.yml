name: Patch S/F session guard

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-save-line-session.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard S/F setup and wait for physical start
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()

          old = 'static void saveCustomLine(){double lat,lon;uint8_t fix;float speed;'
          new = 'static void saveCustomLine(){if(measurementLocked)return;double lat,lon;uint8_t fix;float speed;'
          if old not in s:
              raise SystemExit('saveCustomLine start not found')
          s = s.replace(old, new, 1)

          old = 'lapStartTow=rbTowMs;lapClockRunning=true;rbRequestRecording(true);lapCount=0;'
          new = 'lapStartTow=rbTowMs;lapClockRunning=false;measurementActive=false;rbRequestRecording(false);lapCount=0;'
          if old not in s:
              raise SystemExit('saveCustomLine auto-start block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'Require physical button to start measurement session'
          git push
