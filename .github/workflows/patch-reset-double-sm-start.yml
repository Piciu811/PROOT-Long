name: Patch reset double-click and S/M start

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-reset-double-sm-start.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()

          old_save = '''static void saveCustomLine(){if(measurementLocked)return;double lat,lon;uint8_t fix;float speed;portENTER_CRITICAL(&rbDataMux);lat=rbLat;lon=rbLon;fix=rbFix;speed=rbSpeedKmh;portEXIT_CRITICAL(&rbDataMux);if(fix<2)return;factoryTrackActive=false;factoryTrackId=0;factoryTrackIndex=-1;manualCustomLine=true;customLat=lat;customLon=lon;customLineValid=true;customLineArmed=false;customDirectionPending=true;if(havePrevFix&&speed>=3.0f){double dx=localX(lon,lat)-localX(prevLon,lat),dy=localY(lat)-localY(prevLat),nn=sqrt(dx*dx+dy*dy);if(nn>=0.20){customDirX=dx/nn;customDirY=dy/nn;customDirectionPending=false;}}lapStartTow=rbTowMs;lapClockRunning=false;measurementActive=false;rbRequestRecording(false);lapCount=0;lapLastMs=lapBestMs=0;lapDeltaValid=false;lastCrossTow=0;lapHistoryN=0;lapHistoryPage=0;timingStopped=false;refTraceN=curTraceN=refCursor=0;lastTraceTow=0;customSavedAt=millis();prefs.begin("proot",false);prefs.putDouble("sfLat",customLat);prefs.putDouble("sfLon",customLon);prefs.putDouble("sfDx",customDirX);prefs.putDouble("sfDy",customDirY);prefs.putBool("sfOk",true);prefs.end();}'''
          new_save = '''static void saveCustomLine(){double lat,lon;uint8_t fix,sats;float speed;uint32_t tow;portENTER_CRITICAL(&rbDataMux);lat=rbLat;lon=rbLon;fix=rbFix;sats=rbSats;speed=rbSpeedKmh;tow=rbTowMs;portEXIT_CRITICAL(&rbDataMux);if(fix<2||sats==0)return;factoryTrackActive=false;factoryTrackId=0;factoryTrackIndex=-1;manualCustomLine=true;customLat=lat;customLon=lon;customLineValid=true;customLineArmed=false;customDirectionPending=true;if(havePrevFix&&speed>=3.0f){double dx=localX(lon,lat)-localX(prevLon,lat),dy=localY(lat)-localY(prevLat),nn=sqrt(dx*dx+dy*dy);if(nn>=0.20){customDirX=dx/nn;customDirY=dy/nn;customDirectionPending=false;}}lapStartTow=tow;lapClockRunning=true;measurementActive=true;measurementLocked=false;rbRequestRecording(true);lapCount=0;lapLastMs=lapBestMs=0;lapDeltaValid=false;lastCrossTow=0;lapHistoryN=0;lapHistoryPage=0;timingStopped=false;refTraceN=curTraceN=refCursor=0;lastTraceTow=0;customSavedAt=millis();prefs.begin("proot",false);prefs.putDouble("sfLat",customLat);prefs.putDouble("sfLon",customLon);prefs.putDouble("sfDx",customDirX);prefs.putDouble("sfDy",customDirY);prefs.putBool("sfOk",true);prefs.end();}'''
          if old_save not in s:
              raise SystemExit('saveCustomLine target not found')
          s = s.replace(old_save, new_save, 1)

          marker = 'void setup(){Serial.begin(115200);'
          helper = '''static void resetMeasurementSession(){rbRequestRecording(false);measurementActive=false;measurementLocked=false;lapClockRunning=false;timingStopped=false;lapCount=0;lapLastMs=lapBestMs=0;lapDeltaValid=false;lapHistoryN=0;lapHistoryPage=0;refTraceN=curTraceN=refCursor=0;lastTraceTow=0;lastCrossTow=0;customLineValid=false;customLineArmed=false;customDirectionPending=false;havePrevFix=false;customLat=customLon=customDirX=customDirY=prevLat=prevLon=0;customSavedAt=0;lapFlashStarted=0;prefs.begin("proot",false);prefs.putBool("sfOk",false);prefs.remove("sfLat");prefs.remove("sfLon");prefs.remove("sfDx");prefs.remove("sfDy");prefs.end();}\n'''
          if marker not in s:
              raise SystemExit('setup marker not found')
          s = s.replace(marker, helper + marker, 1)

          old_reset = '''  static uint32_t resetPressStarted=0;static bool resetHoldDone=false;bool resetDown=(digitalRead(PIN_BUTTON_1)==LOW);if(resetDown&&!resetPressStarted&&!resetHoldDone)resetPressStarted=millis();if(resetDown&&resetPressStarted&&!resetHoldDone&&millis()-resetPressStarted>=3000u){touchLocked=!touchLocked;resetHoldDone=true;resetPressStarted=0;if(connState==CONN_OK&&rbConnected&&screen){while(lcd_PushColors_len>0){lcd_PushColors(0,0,0,0,NULL);delay(1);}drawRaceBoxLive();}}if(!resetDown&&resetPressStarted&&!resetHoldDone){uint32_t held=millis()-resetPressStarted;if(held>=50u&&held<3000u&&connState==CONN_OK&&rbConnected){if(measurementActive){rbRequestRecording(false);measurementActive=false;measurementLocked=true;timingStopped=true;lapClockRunning=false;lapDeltaValid=false;lapFlashStarted=0;}else if(!measurementLocked){uint8_t fix,sats;uint32_t tow;portENTER_CRITICAL(&rbDataMux);fix=rbFix;sats=rbSats;tow=rbTowMs;portEXIT_CRITICAL(&rbDataMux);if(fix>=2&&sats>0){measurementActive=true;timingStopped=false;lapClockRunning=true;lapStartTow=tow;lapDeltaValid=false;lapFlashStarted=0;curTraceN=0;refCursor=0;lastTraceTow=0;lastCrossTow=0;customLineArmed=false;rbRequestRecording(true);}}if(screen){while(lcd_PushColors_len>0){lcd_PushColors(0,0,0,0,NULL);delay(1);}drawRaceBoxLive();}}resetPressStarted=0;resetHoldDone=false;}else if(!resetDown){resetPressStarted=0;resetHoldDone=false;}'''
          new_reset = '''  static uint32_t resetPressStarted=0;static bool resetHoldDone=false;static uint32_t lastResetClickMs=0;bool resetDown=(digitalRead(PIN_BUTTON_1)==LOW);if(resetDown&&!resetPressStarted&&!resetHoldDone)resetPressStarted=millis();if(resetDown&&resetPressStarted&&!resetHoldDone&&millis()-resetPressStarted>=3000u){touchLocked=!touchLocked;resetHoldDone=true;resetPressStarted=0;if(connState==CONN_OK&&rbConnected&&screen){while(lcd_PushColors_len>0){lcd_PushColors(0,0,0,0,NULL);delay(1);}drawRaceBoxLive();}}if(!resetDown&&resetPressStarted&&!resetHoldDone){uint32_t held=millis()-resetPressStarted;if(held>=50u&&held<3000u&&connState==CONN_OK&&rbConnected){uint32_t now=millis();bool doubleClick=lastResetClickMs&&(now-lastResetClickMs<=450u);lastResetClickMs=doubleClick?0:now;if(doubleClick){resetMeasurementSession();}else if(measurementActive){rbRequestRecording(false);measurementActive=false;measurementLocked=true;timingStopped=true;lapClockRunning=false;lapDeltaValid=false;lapFlashStarted=0;}else if(!measurementLocked){uint8_t fix,sats;uint32_t tow;portENTER_CRITICAL(&rbDataMux);fix=rbFix;sats=rbSats;tow=rbTowMs;portEXIT_CRITICAL(&rbDataMux);if(fix>=2&&sats>0){measurementActive=true;timingStopped=false;lapClockRunning=true;lapStartTow=tow;lapDeltaValid=false;lapFlashStarted=0;curTraceN=0;refCursor=0;lastTraceTow=0;lastCrossTow=0;customLineArmed=false;rbRequestRecording(true);}}if(screen){while(lcd_PushColors_len>0){lcd_PushColors(0,0,0,0,NULL);delay(1);}drawRaceBoxLive();}}resetPressStarted=0;resetHoldDone=false;}else if(!resetDown){resetPressStarted=0;resetHoldDone=false;}'''
          if old_reset not in s:
              raise SystemExit('reset button target not found')
          s = s.replace(old_reset, new_reset, 1)

          old_long = '''if(!touchLocked&&down&&stopPressStarted&&!stopLongDone&&millis()-stopPressStarted>=3000u){rbRequestRecording(false);measurementActive=false;measurementLocked=false;lapClockRunning=false;timingStopped=false;lapCount=0;lapLastMs=lapBestMs=0;lapDeltaValid=false;lapHistoryN=0;lapHistoryPage=0;refTraceN=curTraceN=refCursor=0;lastTraceTow=0;lastCrossTow=0;customLineValid=false;customLineArmed=false;customDirectionPending=false;havePrevFix=false;customLat=customLon=customDirX=customDirY=prevLat=prevLon=0;customSavedAt=0;lapFlashStarted=0;prefs.begin("proot",false);prefs.putBool("sfOk",false);prefs.remove("sfLat");prefs.remove("sfLon");prefs.remove("sfDx");prefs.remove("sfDy");prefs.end();stopLongDone=true;stopPressStarted=0;'''
          new_long = '''if(!touchLocked&&down&&stopPressStarted&&!stopLongDone&&millis()-stopPressStarted>=3000u){resetMeasurementSession();stopLongDone=true;stopPressStarted=0;'''
          if old_long not in s:
              raise SystemExit('long STOP target not found')
          s = s.replace(old_long, new_long, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'Add reset double-click reset and S/M start'
          git push
